<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Claude Todo — 待办清单</title>
  <meta name="description" content="一个以 Claude Code 桌面端设计风格打造的待办清单应用">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23D97757'%20stroke-width='2.4'%20stroke-linecap='round'%3E%3Cpath%20d='M12%202.5v5.5M12%2016v5.5M2.5%2012H8M16%2012h5.5M5.3%205.3l3.9%203.9M14.8%2014.8l3.9%203.9M18.7%205.3l-3.9%203.9M9.2%2014.8l-3.9%203.9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 2.5v5.5M12 16v5.5M2.5 12H8M16 12h5.5M5.3 5.3l3.9 3.9M14.8 14.8l3.9 3.9M18.7 5.3l-3.9 3.9M9.2 14.8l-3.9 3.9"/>
          </svg>
        </span>
        <span class="brand-name">Claude Todo</span>
        <button id="themeToggle" class="icon-btn" title="切换深浅色主题" aria-label="切换深浅色主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/>
          </svg>
        </button>
      </div>

      <button id="newTaskBtn" class="new-task-btn">
        <span class="plus" aria-hidden="true">＋</span> 新任务
      </button>

      <nav class="nav" id="filters" aria-label="任务筛选">
        <button class="nav-item active" data-filter="all">
          全部<span class="badge" id="countAll">0</span>
        </button>
        <button class="nav-item" data-filter="active">
          进行中<span class="badge" id="countActive">0</span>
        </button>
        <button class="nav-item" data-filter="done">
          已完成<span class="badge" id="countDone">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="progress">
          <div class="progress-label"><span>今日进度</span><span id="progressText" class="mono">0 / 0</span></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <p class="sidebar-note">数据仅保存在本地浏览器</p>
      </div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <main class="main">
      <div class="main-inner">

        <header class="header">
          <p class="eyebrow"><span class="dot" aria-hidden="true"></span><span id="dateLine"></span></p>
          <h1 id="greeting"></h1>
        </header>

        <form class="composer" id="composer">
          <input id="taskInput" type="text" placeholder="有什么需要做的？输入后按回车添加…" autocomplete="off" maxlength="200">
          <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="添加任务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>
            </svg>
          </button>
        </form>

        <div class="list-head" id="listHead" hidden>
          <span id="listTitle">全部任务</span>
          <button id="clearDone" class="link-btn" type="button">清除已完成</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="empty" id="empty" hidden>
          <span class="empty-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 2.5v5.5M12 16v5.5M2.5 12H8M16 12h5.5M5.3 5.3l3.9 3.9M14.8 14.8l3.9 3.9M18.7 5.3l-3.9 3.9M9.2 14.8l-3.9 3.9"/>
            </svg>
          </span>
          <p class="empty-title" id="emptyTitle">还没有任务</p>
          <p class="empty-sub" id="emptySub">在上方输入框添加你的第一个任务吧</p>
        </div>

        <footer class="foot">
          <span class="foot-logo" aria-hidden="true">✳</span> 由 Claude Code 构建
        </footer>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
